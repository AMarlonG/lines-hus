<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Huset – versjon 1 · 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2328}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  .panel{position:fixed;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.12)}
  #top{top:10px;left:10px;padding:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100vw - 20px);border-radius:12px}
  #top h1{font-size:13px;margin:0 2px;font-weight:650;white-space:nowrap}
  button{font:inherit;font-size:12px;border:0;background:transparent;color:#4b525a;border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  button:hover{background:rgba(0,0,0,.06)}
  .seg{display:flex;background:#eef0f2;border-radius:9px;padding:2px;gap:1px}
  .seg button.on{background:#1f2328;color:#fff}
  .grp{display:flex;align-items:center;gap:6px}
  button.icon{font-size:15px;line-height:1;padding:4px 8px;color:#1f2328}
  label{font-size:12px;color:#4b525a;display:flex;align-items:center;gap:4px;cursor:pointer;padding-right:4px}
  #room{left:50%;transform:translateX(-50%);bottom:14px;padding:6px 14px;font-size:13px;color:#4b525a;white-space:nowrap}
  #room b{color:#1f2328}
  #map{right:12px;bottom:12px;width:230px;height:210px;cursor:crosshair}
  #help{left:10px;bottom:10px;padding:6px 10px;font-size:11px;line-height:1.5;color:#6a7079;white-space:nowrap;opacity:.85}
  #help kbd{background:#eef0f2;border-radius:4px;padding:1px 5px;font:inherit;font-size:11px;color:#1f2328}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
  #stick{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);display:none;pointer-events:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85)}
  .touch .desk{display:none} .notouch .mob{display:none}
  @media (max-width:640px){#map{width:150px;height:137px}#help{display:none!important}#room{bottom:auto;top:auto;bottom:160px}}

  #start{position:fixed;inset:0;overflow:auto;background:linear-gradient(180deg,#eef3f7 0%,#f7f5f1 100%);z-index:5}
  #start .wrap{max-width:1180px;margin:0 auto;padding:48px 24px 64px}
  #start header h1{font-size:34px;margin:0 0 8px;font-weight:700;letter-spacing:-.3px}
  #start header p{margin:0 0 32px;color:#5a6169;font-size:16px}
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
  .card{display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 2px 14px rgba(20,30,40,.08);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(20,30,40,.14)}
  .thumb{position:relative;aspect-ratio:880/560;background:#dfe7ee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;left:12px;top:12px;background:rgba(31,35,40,.85);color:#fff;font-size:12px;padding:5px 10px;border-radius:20px}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h2{margin:0;font-size:20px}
  .card .sub{color:#6a7079;font-size:14px}
  .card ul{margin:6px 0 10px;padding-left:18px;color:#3d434a;font-size:13.5px;line-height:1.55}
  .card .open{margin-top:auto;font-weight:600;font-size:14px;color:#1f5f8b}
  .loading{color:#6a7079}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel" style="display:none">
  <button id="back" class="icon" title="Alle versjoner">←</button><h1 id="vtitle"></h1>
  <div class="seg" id="altrow" style="display:none"></div>
  <div class="seg"><button data-mode="doll" class="on">Oversikt</button><button data-mode="walk">Gå</button></div>
  <div class="grp" id="floors">
    <div class="seg"><button data-floor="g" class="on">1. etg</button><button data-floor="u">2. etg</button><button data-floor="all">Tak</button></div>
    <label><input type="checkbox" id="labels" checked> Navn</label>
  </div>
  <div class="seg" id="walkbar" style="display:none"><button data-go="out">Ytterdør</button><button data-go="g">1. etg</button><button data-go="u">2. etg</button></div>
</div>
<div id="start">
  <div class="wrap">
    <header><h1>Huset ved sjøen</h1><p>Tre versjoner som 3D-modeller. Velg en for å se den ovenfra eller gå rundt inne i huset.</p></header>
    <div id="cards"><div class="loading">Bygger modellene …</div></div>
  </div>
</div>
<div id="room" class="panel" style="display:none"></div>
<canvas id="map" class="panel" width="460" height="420" style="display:none"></canvas>
<div id="help" class="panel" style="display:none">
  <div class="desk"><kbd>WASD</kbd> gå · mus ser · <kbd>Shift</kbd> løp · <kbd>Esc</kbd> slipp · <kbd>Tab</kbd> oversikt</div>
  <div class="mob">Venstre tommel går · høyre ser</div>
</div>
<div id="stick"><div id="knob"></div></div>
<script>document.documentElement.className = matchMedia('(pointer:coarse)').matches ? 'touch' : 'notouch';</script>
